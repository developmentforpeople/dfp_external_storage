# nginx front end for the devcontainer, which ships no frontend service of its own.
#
# `bench serve` (port 8002) is Werkzeug and cannot act on X-Accel-Redirect, so without
# something like this in front, dev silently falls back to the presigned 302. This
# container stands in for frappe_docker's `frontend`: it injects X-Use-X-Accel-Redirect
# and owns the /dfp-s3-internal/ location, so dev exercises the same path as production.
#
# Browse dev through it instead of 8002:  http://dev.galcom.local:8090/app
#
#   docker run -d --name dfp-xaccel-test --restart unless-stopped \
#     --network frappe_docker_devcontainer_default \
#     -v $PWD/nginx/dev-devcontainer.conf:/etc/nginx/conf.d/default.conf:ro \
#     -p 8090:80 nginx:alpine
#
#   docker rm -f dfp-xaccel-test        # to remove
#   docker restart dfp-xaccel-test      # after editing this file
#
# Not for staging or production -- use nginx/frappe_docker/frappe.conf.template there.

upstream dfp_s3_backend {
	server joshua.galcom.local:9000 fail_timeout=0;
	keepalive 8;
}
upstream frappe-backend {
	server frappe:8002 fail_timeout=0;
}
upstream frappe-socketio {
	server frappe:9002 fail_timeout=0;
}

server {
	listen 80;
	server_name _;

	# Dev uploads go through the chunked uploader; nginx's 1m default would break them.
	client_max_body_size 0;

	# Mirrors the production internal location.
	location /dfp-s3-internal/ {
		internal;

		# Must match the endpoint the presigned URL was signed for, byte for byte.
		proxy_set_header Host joshua.galcom.local:9000;
		proxy_set_header Authorization "";
		proxy_set_header Cookie "";

		proxy_http_version 1.1;
		proxy_set_header Connection "";

		proxy_buffering off;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;

		proxy_connect_timeout 15s;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;

		proxy_hide_header x-amz-id-2;
		proxy_hide_header x-amz-request-id;

		proxy_pass http://dfp_s3_backend/;
	}

	# Realtime: without this, progress bars and notifications stop working on :8090.
	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Frappe-Site-Name $host;
		proxy_set_header Origin $scheme://$http_host;
		proxy_pass http://frappe-socketio;
	}

	# Stands in for frappe_docker's @webserver location.
	location / {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_redirect off;

		# Dev requests can be slow (builds, long reports).
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;

		proxy_pass http://frappe-backend;
	}
}
